# Best-effort engineering interpretation — not a legal opinion.
# This mapping is a technical correspondence by an engineer between
# Guardian-BR's guardrail rules and articles of Lei nº 13.709/2018 (LGPD).
# It is NOT legal advice and has not been reviewed by ANPD. Community
# legal review is welcome via GitHub issues. See SPEC §Resolved Decisions #5.
schema_version: 1
disclaimer: >
  Best-effort engineering interpretation — not a legal opinion.
  This mapping is a technical correspondence by an engineer between
  Guardian-BR's guardrail rules and articles of Lei nº 13.709/2018 (LGPD).
  It is NOT legal advice and has not been reviewed by ANPD.
  Community legal review is welcome via GitHub issues.
rules:
  BR_CPF:
    description: "Cadastro de Pessoas Físicas — Brazilian individual taxpayer ID."
    sensitivity: "personal"
    lgpd_articles:
      - article: "Art. 5º, I"
        clause: "dado pessoal"
      - article: "Art. 6º"
        clause: "princípio da minimização"
    art7_purpose_bases:
      - "I"
      - "V"
    retention_note: "Mask in transit; do not persist raw value in logs."
    notes: >
      CPF detection requires mod-11 checksum validation. Mathematically
      valid synthetic CPFs (e.g., 111.111.111-11) are reported as PII —
      masking is content-blind by design (SPEC Failure Mode #2).
      Do NOT add a rejection rule for synthetic sequences.
  BR_CNPJ:
    description: "Cadastro Nacional da Pessoa Jurídica — Brazilian company taxpayer ID."
    sensitivity: "personal"
    lgpd_articles:
      - article: "Art. 5º, I"
        clause: "dado pessoal (pessoa jurídica tratada como pessoal pelo controlador quando reidentifica titular)"
      - article: "Art. 6º"
        clause: "princípio da minimização"
    art7_purpose_bases:
      - "I"
      - "V"
    retention_note: "Mask in transit; do not persist raw value in logs."
    notes: >
      CNPJ detection requires mod-11 checksum validation with two distinct
      weight sequences (positions 12 and 13). Mathematically valid synthetic
      CNPJs (e.g., 00.000.000/0000-00) are reported as PII — masking is
      content-blind by design (SPEC Failure Mode #2). Under LGPD, CNPJ is
      not always "personal data" per se (the holder is a legal entity), but
      Guardian-BR masks it because in customer-service logs it routinely
      co-occurs with — and helps reidentify — the natural persons operating
      those entities (Art. 5º I via association). Do NOT add a rejection rule
      for synthetic sequences.
  BR_PIS:
    description: "PIS/PASEP/NIS — Brazilian social-security and employment registry number."
    sensitivity: "personal"
    lgpd_articles:
      - article: "Art. 5º, I"
        clause: "dado pessoal"
      - article: "Art. 6º"
        clause: "princípio da minimização"
    art7_purpose_bases:
      - "I"
      - "V"
    retention_note: "Mask in transit; do not persist raw value in logs."
    notes: >
      PIS detection requires mod-11 checksum validation with weights
      [3,2,9,8,7,6,5,4,3,2] over the first 10 digits. Mathematically valid
      synthetic PIS numbers (e.g., 000.00000.00-0) are reported as PII —
      masking is content-blind by design (SPEC Failure Mode #2). An
      unformatted 11-digit string that satisfies both the CPF and PIS
      checksums (rare — ~1/1331 of random 11-digit runs, but exact for
      00000000000) is flagged as both BR_CPF and BR_PIS; downstream
      consumers must not assume detection types are mutually exclusive.
      Do NOT add a rejection rule for synthetic sequences.
  BR_CNH:
    description: "Carteira Nacional de Habilitação — Brazilian driver's license register number."
    sensitivity: "personal"
    lgpd_articles:
      - article: "Art. 5º, I"
        clause: "dado pessoal — informação relacionada a pessoa natural identificada ou identificável"
      - article: "Art. 6º"
        clause: "princípio da minimização — uso restrito ao necessário"
    art7_purpose_bases:
      - "I"
      - "V"
    retention_note: "Mask in transit; do not persist raw value in logs."
    notes: >
      CNH detection uses a single unformatted-only regex (\d{11}) gated by
      mod-11 checksum (DENATRAN descontador rule). The same 11-digit span
      may also match BR_CPF and/or BR_PIS — all matching detections are
      emitted (emit-both policy, never deduplicated). 00000000000 satisfies
      all three checksums (CPF, PIS, CNH). Mathematically valid synthetic
      sequences (e.g. 11111111111) are intentionally reported as PII per
      SPEC Failure Mode #2. Do NOT add a rejection rule for synthetic
      sequences.
  BR_TITULO_ELEITOR:
    description: "Título de eleitor — Brazilian voter registration ID issued by TSE."
    sensitivity: "personal"
    lgpd_articles:
      - article: "Art. 5º, I"
        clause: "dado pessoal — informação relacionada a pessoa natural identificada ou identificável"
      - article: "Art. 6º"
        clause: "princípio da minimização — uso restrito ao necessário"
    art7_purpose_bases:
      - "I"
      - "V"
    retention_note: "Mask in transit; do not persist raw value in logs."
    notes: >
      Título de eleitor detection uses a 12-digit pattern with optional 4-4-4
      separators (space or dot), gated by the TSE checksum. Validation includes
      a state-code lookup (digits 9-10 must be 01-28) and the SP/MG "DV cannot
      be zero" clamp (for states 01 and 02, a computed DV of 0 is forced to 1).
      Distinct length from CPF/PIS/CNH (11) and CNPJ (14), so no emit-both
      overlap with existing BR recognizers. Mathematically valid synthetic
      títulos are intentionally reported as PII per SPEC Failure Mode #2.
      Do NOT add a rejection rule for synthetic sequences.
