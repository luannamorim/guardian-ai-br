name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test

      - name: Benchmark (CPF recall gate)
        run: make eval-quick CATEGORY=cpf

      - name: Eval gate (PII recall must stay >= 99%)
        run: make eval-gate
