[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardrails-br"
version = "0.1.0"
description = "Brazilian LLM guardrails: BR PII detection with LGPD mapping and PT-BR adversarial classification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2.355,<3",
    "pydantic>=2.6",
    "regex>=2024.4.16",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
    "opentelemetry-api>=1.24,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]
dashboard = [
    "streamlit>=1.32,<2",
    "pandas>=2.2,<3",
    "altair>=5,<6",
    "pydantic-settings>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "guardrails-br[api]",
    "guardrails-br[dashboard]",
    "pyjwt>=2.8",
    "asgi-lifespan>=2.1",
]

[project.scripts]
guardian-br-eval = "guardian_br.eval.runner:main"
guardian-br-dashboard = "guardian_br.dashboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardian_br"]
include = [
    "src/guardian_br/data/*.yaml",
    "src/guardian_br/prompts/*.md",
    "src/guardian_br/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "evals/",
    "Makefile",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["guardian_br"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["regex", "presidio_analyzer", "presidio_analyzer.*", "spacy", "spacy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*", "prometheus_client", "prometheus_client.*", "pydantic_settings", "pydantic_settings.*", "jwt", "cryptography", "cryptography.*", "httpx", "httpx.*", "streamlit", "streamlit.*", "pandas", "pandas.*", "altair", "altair.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
