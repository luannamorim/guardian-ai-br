services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    command: ollama pull llama-guard3:8b
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: on-failure

  guardian-br:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      GUARDIAN_BR_OLLAMA_BASE_URL: http://ollama:11434
      GUARDIAN_BR_ADVERSARIAL_ENABLED: "true"
      GUARDIAN_BR_AUDIT_HMAC_CHAIN: "true"
      # GUARDIAN_BR_KEK_v1: "base64-encoded-32-byte-key"
      # GUARDIAN_BR_KEK_CURRENT_ID: "v1"
      # GUARDIAN_BR_API_KEYS_HASHED: "sha256:abc123...  (scan key, no scope suffix)"
      # GUARDIAN_BR_API_KEYS_HASHED: "sha256:abc123...:audit:read  (audit reader key)"
      # GUARDIAN_BR_AUDIT_SALT: "base64-encoded-32-byte-salt  (required in prod; random per-process if absent)"
      # GUARDIAN_BR_AUDIT_HMAC_SECRET: "base64-encoded-32-byte-secret  (required when AUDIT_HMAC_CHAIN=true)"
      # GUARDIAN_BR_AUDIT_FALLBACK_PATH: "/var/lib/guardian/audit_fallback.jsonl"
      # GUARDIAN_BR_OTLP_ENDPOINT: "http://otel-collector:4317"  # gRPC; enables OTel traces
      # GUARDIAN_BR_OTEL_SERVICE_NAME: "guardian-br"
    restart: unless-stopped

  guardian-br-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    depends_on:
      guardian-br:
        condition: service_healthy
    environment:
      GUARDIAN_BR_DASHBOARD_API_URL: http://guardian-br:8000
      # GUARDIAN_BR_DASHBOARD_API_KEY: "audit-reader-key  (must match a key hashed with :audit:read suffix in the API service)"
    restart: unless-stopped

volumes:
  ollama-models:
